name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Cloudflare dashboard after checks pass
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install dashboard dependencies
        run: npm ci

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Check dashboard and worker JavaScript
        run: |
          node --check app.js
          node --check infra/cloudflare/worker.js

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Check Terraform formatting
        run: terraform -chdir=infra/aws fmt -check

      - name: Check Cloudflare Worker bundle
        run: npm run cloudflare:check

  deploy-cloudflare:
    name: Deploy Cloudflare dashboard
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Stage dashboard assets
        run: npm run cloudflare:stage

      - name: Configure snapshot endpoint secret
        env:
          AWS_SNAPSHOT_URL: ${{ secrets.AWS_SNAPSHOT_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${AWS_SNAPSHOT_URL}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          printf "%s" "${AWS_SNAPSHOT_URL}" | ./node_modules/.bin/wrangler secret put AWS_SNAPSHOT_URL --config infra/cloudflare/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config infra/cloudflare/wrangler.jsonc
